# Registre des tags (D53). Pour en ajouter un : une entrée ici, puis l'identifiant dans le frontmatter des articles.
# Deux sortes de tags :
# - les rubriques (rubrique: true) disent quel genre d'article c'est : une et une seule par article. Elles ont un
#   singulier (badge des cartes) et une icône, et apparaissent dans le menu et les filtres de la bibliothèque ;
# - les sujets disent de quoi parle l'article : autant que nécessaire. Chacun a une famille (lieu, serie, groupe,
#   notion, selection, cf. src/lib/familles.ts) qui le range sur la page des sujets.
# Un tag inconnu, un article sans rubrique ou avec deux rubriques fait échouer le build.
# Tout s'affiche par ordre alphabétique : l'ordre de ce fichier est libre.

# Rubriques
quetes:
  libelle: Quêtes
  singulier: Quête
  description: Les aventures du Voyageur, racontées et expliquées.
  rubrique: true
  icone: livre
personnages:
  libelle: Personnages
  singulier: Personnage
  description: Les visages, les choix et les histoires qui façonnent ce monde.
  rubrique: true
  icone: personne
bandes-annonces:
  libelle: Bandes-annonces
  singulier: Bande-annonce
  description: Les résumés des bandes-annonces des nouvelles versions de Genshin Impact.
  rubrique: true
  icone: video
theories:
  libelle: Théories
  singulier: Théorie
  description: Hypothèses et lectures des mystères de Teyvat, à distinguer de ce que le jeu affirme.
  rubrique: true
  icone: ampoule

# Sujets
teyvat:
  libelle: Teyvat
  description: Le monde de Genshin Impact et ses sept nations.
  famille: lieu
