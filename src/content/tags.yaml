  description: Venus de la mer d'étoiles, les Descendeurs échappent aux lois de l'ordre divin et à la mémoire d'Irminsul. Quatre ont marqué l'histoire de Teyvat, assez puissants pour en changer le destin.
  famille: groupe
elements:
